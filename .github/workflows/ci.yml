name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Run unit tests
        run: |
          go test ./internal/queue/... \
                  ./internal/ai/... \
                  ./internal/config/... \
                  ./internal/api/middleware/... \
                  ./internal/worker/... \
                  ./internal/webhook/... \
                  ./internal/metrics/... \
                  ./internal/telemetry/... \
                  ./client/... \
                  ./cmd/seeder/... \
                  -v -count=1 -timeout 90s

      - name: Build API
        run: go build -o /dev/null ./cmd/api

      - name: Build Worker
        run: go build -o /dev/null ./cmd/worker

      - name: Build Scheduler
        run: go build -o /dev/null ./cmd/scheduler

      - name: Build Seeder
        run: go build -o /dev/null ./cmd/seeder

      - name: Build Obsidianctl CLI
        run: go build -o /dev/null ./cmd/obsidianctl

      - name: Build SDK Example
        run: go build -o /dev/null ./examples/enqueue

  dashboard:
    name: Dashboard Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      - name: Build dashboard
        run: npm run build
        working-directory: dashboard
        env:
          VITE_API_URL: https://obsidian-api.up.railway.app

