apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-api
  namespace: obsidian
  labels:
    app: obsidian-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: obsidian-api
  template:
    metadata:
      labels:
        app: obsidian-api
    spec:
      containers:
        - name: api
          image: ghcr.io/adeshdeshmukh/obsidian-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: obsidian-config
            - secretRef:
                name: obsidian-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: obsidian-api
  namespace: obsidian
spec:
  selector:
    app: obsidian-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
