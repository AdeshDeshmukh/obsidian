apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-scheduler
  namespace: obsidian
  labels:
    app: obsidian-scheduler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: obsidian-scheduler
  template:
    metadata:
      labels:
        app: obsidian-scheduler
    spec:
      containers:
        - name: scheduler
          image: ghcr.io/adeshdeshmukh/obsidian-scheduler:latest
          envFrom:
            - configMapRef:
                name: obsidian-config
            - secretRef:
                name: obsidian-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
