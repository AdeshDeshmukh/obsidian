version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: obsidian-postgres
    environment:
      POSTGRES_DB: obsidian
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: obsidian
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
