services:
  # Obsidian Core REST & WebSocket API
  - type: web
    name: obsidian-api
    runtime: docker
    dockerfilePath: docker/api.Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false # Set to your free Neon or Supabase PostgreSQL connection string
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # Optional Gemini key for DLQ AI triage

  # Obsidian Background Worker Fleet
  - type: worker
    name: obsidian-worker
    runtime: docker
    dockerfilePath: docker/worker.Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: obsidian-api
          envVarKey: DATABASE_URL
      - key: CONCURRENCY
        value: 10
