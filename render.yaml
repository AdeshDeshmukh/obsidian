services:
  # Obsidian Core REST & WebSocket API with Embedded Background Worker Pool
  - type: web
    name: obsidian-api
    runtime: docker
    dockerfilePath: docker/api.Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false # Set to your free Neon PostgreSQL connection string
      - key: JWT_SECRET
        generateValue: true
      - key: EMBED_WORKER
        value: "true"
      - key: GEMINI_API_KEY
        sync: false # Optional Gemini key for DLQ AI triage
